<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>PowerNexx Vertriebsbüro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed dark control rail (like a switchboard) + light working surface; collapses to a top bar on phones */
/* PowerNexx brand (from powernexx.de): navy hsl(220 60% 12%), lime hsl(85 80% 45%), Plus Jakarta Sans.
   --brand = lime fill for buttons/marks (navy text on it); --accent = readable green for text on light ground */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#e9edf3; --fg:#121722; --muted:#626d80; --line:#e1e5ec;
  --brand:#64cf17; --brand-ink:#0c1831;
  --accent:#438613; --accent-ink:#0c1831; --accent-soft:#e8f6d9;
  --volt:#e9b10f; --volt-soft:#fbf1cf;
  --good:#2f8a1f; --warn:#b7791f; --bad:#d64545; --info:#2563a8;
  --rail:#0c1831; --rail-2:#172a45; --rail-fg:#e6ebf3; --rail-muted:#8b97ab;
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081021; --surface:#0f1a2e; --surface-2:#16233b; --fg:#f5f7fa; --muted:#9aa3b3; --line:#1f2d47;
  --brand:#6ee61a; --brand-ink:#0c1831;
  --accent:#7fe32e; --accent-ink:#0c1831; --accent-soft:#1d3317; --volt:#f2c440; --volt-soft:#3a3115;
  --good:#7fe32e; --warn:#e3a649; --bad:#ef746c; --info:#6fa7e8;
  --rail:#060d1b; --rail-2:#13203a; --rail-fg:#e6ebf3; --rail-muted:#8b97ab; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081021; --surface:#0f1a2e; --surface-2:#16233b; --fg:#f5f7fa; --muted:#9aa3b3; --line:#1f2d47;
  --brand:#6ee61a; --brand-ink:#0c1831;
  --accent:#7fe32e; --accent-ink:#0c1831; --accent-soft:#1d3317; --volt:#f2c440; --volt-soft:#3a3115;
  --good:#7fe32e; --warn:#e3a649; --bad:#ef746c; --info:#6fa7e8;
  --rail:#060d1b; --rail-2:#13203a; --rail-fg:#e6ebf3; --rail-muted:#8b97ab; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:36px;height:36px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.1;letter-spacing:-.01em}
.brand-name .nx{color:var(--brand)}
.brand-sub{font-size:.72rem;color:var(--rail-muted);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-group{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;font-size:.92rem;white-space:nowrap}
.nav a:hover{background:var(--rail-2)}
.nav a[aria-current="page"]{background:var(--rail-2);box-shadow:inset 3px 0 0 var(--brand);color:#fff}
.nav a[aria-current="page"] svg{stroke:var(--brand);opacity:1}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--rail-muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.demo-flag{display:inline-flex;align-items:center;gap:6px;background:var(--rail-2);border-radius:999px;padding:3px 10px;color:var(--volt);font-size:.72rem;width:max-content}
/* main */
.main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px;max-width:62ch}
.eyebrow{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .label{font-size:.78rem;color:var(--muted)}
.kpi .value{font-family:var(--f-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:.78rem;color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:80px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.partner{background:var(--accent-soft);color:var(--accent)}
.pill.market{background:var(--surface-2);color:var(--muted)}
.pill.oeko{background:var(--accent-soft);color:var(--good)}
.pill.volt{background:var(--volt-soft);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.list{display:flex;flex-direction:column}
.list>li,.list>.item{list-style:none;padding:11px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.list>li:first-child,.list>.item:first-child{border-top:0}
ul.list{margin:0;padding:0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
/* tariff results */
.tariffs{display:flex;flex-direction:column;gap:10px}
.tariff{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,.8fr)) minmax(0,1.1fr);gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tariff.cheapest{border-color:var(--fg)}
.tariff.best-partner{border:2px solid var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)) padding-box}
.tariff .t-name{font-weight:600}
.tariff .t-meta{font-size:.78rem;color:var(--muted)}
.tariff .t-cell .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tariff .t-cost{text-align:right}
.tariff .t-cost .big{font-family:var(--f-mono);font-size:1.25rem;font-weight:500}
.voucher{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);background:var(--surface);border-radius:8px;padding:10px 12px;grid-column:1/-1}
.voucher code{font-family:var(--f-mono);font-weight:500;font-size:1rem;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.notice{font-size:.8rem;color:var(--muted);border-left:3px solid var(--volt);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col.drop{outline:2px dashed var(--accent)}
.col-head{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left}
.card:hover{border-color:var(--accent)}
.card .c-name{font-weight:600;font-size:.9rem}
.card .c-sub{font-size:.78rem;color:var(--muted)}
/* chat */
.chat{display:flex;flex-direction:column;height:min(640px,70vh);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:78%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;line-height:1.55;font-size:.92rem}
.msg.me{align-self:flex-end;background:var(--rail);color:var(--rail-fg);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
/* toggle */
.toggle{position:relative;width:40px;height:22px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.toggle span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span::after{transform:translateX(18px)}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.82rem}
.flow .step{background:var(--surface-2);border-radius:6px;padding:3px 8px}
.flow .arrow{color:var(--muted)}
/* partner tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{padding-left:22px;border-left:1px solid var(--line);margin-left:9px}
.tree li{padding:5px 0}
.node{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.86rem}
.lvl{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:999px}
.ranks{display:flex;gap:6px;flex-wrap:wrap}
.rank{flex:1;min-width:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem}
.rank.on{border-color:var(--accent);background:var(--accent-soft)}
.rank b{display:block;font-family:var(--f-display);font-size:.9rem}
/* pricing */
.plan{display:flex;flex-direction:column;gap:12px}
.plan.featured{border:2px solid var(--accent)}
.plan .price{font-family:var(--f-mono);font-size:1.7rem;font-weight:500}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
/* white label preview */
.wl-preview{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:120px 1fr;min-height:220px}
.wl-preview .side{padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.78rem}
.wl-preview .body{padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.wl-preview .bar{height:8px;border-radius:4px;background:var(--surface-2)}
/* landing */
.landing{display:flex;flex-direction:column;gap:40px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:12px}
.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.12}
.hero p{font-size:1.05rem;color:var(--muted);max-width:52ch}
.meter{background:var(--rail);color:var(--rail-fg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-mono);font-size:.85rem}
.meter .lcd{background:#0a1411;border:1px solid #233a33;border-radius:8px;padding:14px;color:#9ff0cf;font-size:1.6rem;letter-spacing:.06em;text-align:right}
.meter .meter-row{display:flex;justify-content:space-between;color:var(--rail-muted)}
.meter .meter-row b{color:var(--rail-fg);font-weight:500}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.features .panel h3{margin-bottom:6px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,12,10,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
body.customer .rail{display:none}
body.customer .app{grid-template-columns:minmax(0,1fr)}
.offer-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.offer-line:first-child{border-top:0}
.offer-line.total{font-weight:600;font-size:1.05rem}
@media (max-width: 1020px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-dash,.split,.hero{grid-template-columns:minmax(0,1fr)}
  .features,.g3{grid-template-columns:minmax(0,1fr)}
  .tariff{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tariff .t-main{grid-column:1/-1}
  .tariff .t-cost{text-align:left}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-right:max(14px,env(safe-area-inset-right,0px));gap:12px;z-index:20}
  .brand-sub,.rail-foot,.nav-group{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0;flex:1}
  .nav a{padding:7px 10px}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
  .msg{max-width:92%}
  .wl-preview{grid-template-columns:90px 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = (n, d = 2) => new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const num = (n, d = 0) => new Intl.NumberFormat("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const today = new Date(); today.setHours(0,0,0,0);
const addDays = n => { const d = new Date(today); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmtDate = iso => iso ? new Date(iso+"T00:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}) : "–";
const uid = () => Math.random().toString(36).slice(2,8);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

const tariffProvider = {
  /** Später: echte Tarif-API (z. B. GET AG Vertriebsportal). Liefert Tarife inkl. Jahreskosten. */
  search({seg, typ, plz, kwh}){
    const digits = String(plz||"97688").replace(/\D/g,"").split("").reduce((a,b)=>a+Number(b),0);
    const f = 1 + ((digits % 7) - 3) / 100; // regionaler Netzentgelt-Faktor (Demo)
    return TARIFFS.filter(t=>t.seg===seg && t.typ===typ).map(t=>{
      const ap = +(t.ap*f).toFixed(2);
      const cost = t.gp*12 + ap*kwh/100;
      return {...t, apEff:ap, cost};
    }).sort((a,b)=>a.cost-b.cost);
  }
};
/** Bestpreis-Logik: ehrliche Anzeige, Ausgleich nur aus der Provision. */
function bestPrice(results, minMarge){
  if(!results.length) return {};
  const cheapest = results[0];
  if(cheapest.partner) return {cheapest, bestPartner:cheapest, voucher:0, covered:true};
  const bestPartner = results.find(r=>r.partner);
  if(!bestPartner) return {cheapest, bestPartner:null, voucher:0, covered:false};
  const diff = bestPartner.cost - cheapest.cost;
  const max = Math.max(0, bestPartner.prov - minMarge);
  const voucher = Math.ceil(diff);
  return {cheapest, bestPartner, diff, max, voucher: voucher<=max ? voucher : 0, covered: voucher<=max};
}

   <div class="field"><label for="lfTyp">Sparte</label><select class="input" id="lfTyp"><option value="strom" ${l.typ==="strom"?"selected":""}>Strom</option><option value="gas" ${l.typ==="gas"?"selected":""}>Gas</option></select></div>
   <div class="field"><label for="lfStage">Status</label><select class="input" id="lfStage">${STAGES.map(([k,lab])=>`<option value="${k}" ${l.stage===k?"selected":""}>${lab}</option>`).join("")}</select></div>
   <div class="field"><label for="lfQuelle">Quelle</label><select class="input" id="lfQuelle">${["Meta-Ads","Google-Maps-Suche","Tippgeber","Angebotslink","manuell"].map(q=>`<option ${l.quelle===q?"selected":""}>${q}</option>`).join("")}</select></div>
   <div class="field"><label for="lfWv">Wiedervorlage</label><input class="input" type="date" id="lfWv" value="${l.wv||""}"></div>
   <div class="field"><label for="lfAblauf">Vertragsende</label><input class="input" type="date" id="lfAblauf" value="${l.ablauf||""}"></div></div>
   ${isNew?"":`<div class="row"><span class="small muted">Telefon:</span><span class="mono">${esc(l.tel)}</span><button type="button" class="btn small" data-copy-text="${esc(l.tel)}">Nummer kopieren</button><button type="button" class="btn small" data-wa="${l.id}">WhatsApp (Demo)</button><button type="button" class="btn small" data-compare-lead="${l.id}">Tarif vergleichen</button></div>
   <div><h3 style="margin-bottom:6px">Verlauf</h3><ul class="list">${l.verlauf.slice().reverse().map(v=>`<li><span class="mono small muted" style="width:84px;flex:none">${fmtDate(v.d)}</span><span class="small">${esc(v.t)}</span></li>`).join("")||'<li class="small muted">Noch keine Einträge.</li>'}</ul></div>`}
   <div class="field"><label for="lfNote">Notiz hinzufügen</label><input class="input" id="lfNote" placeholder="z. B. Jahresabrechnung erhalten"></div>
   <div class="row">${isNew?"":`<button type="button" class="btn ghost" data-del-lead="${l.id}" style="color:var(--bad)">Lead löschen</button>`}<span class="spacer"></span><button class="btn primary" type="submit">Speichern</button></div></form>`);
}
function offerModal(t){
  const res = tariffProvider.search(cmp); const bp=bestPrice(res,S.settings.minMarge);
  const v = (bp.bestPartner && bp.bestPartner.id===t.id) ? bp.voucher : 0;
  const tok = `angebot-${t.id}-${cmp.kwh}-${cmp.plz}-${v}`;
  modal(`<div class="row"><h2>Angebot per Link</h2><span class="spacer"></span><button class="btn small ghost" data-close-btn>Schließen</button></div>
   <div class="row"><input class="input mono" id="offerLink" readonly value="${ARTIFACT_URL}#${tok}" style="flex:1"><button class="btn primary" data-copy="#offerLink">Link kopieren</button><button class="btn" data-open-offer="${tok}">Kundenansicht öffnen</button></div>
   <p class="notice">Damit Kunden den Link öffnen können, gib das Artefakt oben rechts über „Teilen“ öffentlich frei. Bis dahin funktioniert er nur für dich.</p>
   <p class="small muted">So sieht dein Kunde das Angebot:</p>
   <div class="panel" style="background:var(--surface-2);display:flex;flex-direction:column;gap:10px">
     <div class="eyebrow">Ihr persönliches Angebot</div><h3>${esc(t.anbieter)} · ${esc(t.name)}</h3>
     <div class="grid g2 small"><div>Grundpreis<br><b class="num">${eur(t.gp)}/Monat</b></div><div>Arbeitspreis<br><b class="num">${num(t.apEff,2)} ct/kWh</b></div><div>Laufzeit<br><b>${esc(t.laufzeit)}</b></div><div>Preisgarantie<br><b>${esc(t.garantie)}</b></div></div>
     <div class="row"><span>Jahreskosten bei ${num(cmp.kwh)} kWh</span><span class="spacer"></span><b class="num">${eur(t.cost,0)}</b></div>
     ${v?`<div class="row"><span>Gutschein <code class="mono">NEXX-${v}</code></span><span class="spacer"></span><b class="num" style="color:var(--good)">−${eur(v,0)}</b></div>`:""}
     <div class="grid g2"><input class="input" placeholder="Vor- und Nachname" aria-label="Name"><input class="input" placeholder="Zählernummer" aria-label="Zählernummer"></div>
     <button class="btn primary" type="button" data-close-btn>Jetzt verbindlich wechseln</button>
     <p class="small muted">Vorschau. Der echte Abschluss läuft später über die Lieferanten-API.</p></div>`);
}

const BOLT=`<img src="${PNX_ICON}" alt="">`;
function parseOffer(tok){
  const p=tok.split("-"); const base=TARIFFS.find(x=>x.id===p[1]); if(!base) return null;
  const kwh=Math.max(100,parseInt(p[2])||3500), plz=(p[3]||"97688").replace(/\D/g,"").slice(0,5)||"97688", v=Math.max(0,parseInt(p[4])||0);
  const t=tariffProvider.search({seg:base.seg,typ:base.typ,plz,kwh}).find(x=>x.id===base.id);
  return {t,kwh,plz,v:Math.min(v,Math.max(0,base.prov))};
}
function customerView(tok){
  const o=parseOffer(tok);
  if(!o) return `<div class="panel empty">Dieses Angebot ist nicht mehr gültig. Bitte fordern Sie bei Ihrem Berater ein neues an.</div>`;
  const {t,kwh,plz,v}=o; const eff=t.cost-v; const steuer=t.seg==="privat"?"inkl. MwSt.":"netto zzgl. MwSt.";
  return `<div style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;width:100%">
   <div class="row"><span class="brand-mark" style="width:30px;height:30px">${S.wl.logo?`<img src="${S.wl.logo}" alt="">`:BOLT}</span><b style="font-family:var(--f-display)">${esc(S.wl.name||"PowerNexx")}</b></div>
   <div><div class="eyebrow">Ihr persönliches Angebot</div><h1 style="margin-top:4px">${esc(t.anbieter)} · ${esc(t.name)}</h1><p class="muted" style="margin-top:6px">${t.typ==="strom"?"Strom":"Gas"} für ${num(kwh)} kWh im Jahr · PLZ ${esc(plz)}${t.oeko?" · Ökotarif":""}</p></div>
   <section class="panel">
     <div class="grid g2 small" style="margin-bottom:12px"><div><span class="muted">Grundpreis</span><br><b class="num">${eur(t.gp)} / Monat</b></div><div><span class="muted">Arbeitspreis</span><br><b class="num">${num(t.apEff,2)} ct/kWh</b></div><div><span class="muted">Laufzeit</span><br><b>${esc(t.laufzeit)}</b></div><div><span class="muted">Preisgarantie</span><br><b>${esc(t.garantie)}</b></div></div>
     <div class="offer-line"><span>Jahreskosten</span><span class="num">${eur(t.cost)}</span></div>
     ${v?`<div class="offer-line"><span>Wechselbonus, Gutschein <code class="mono">NEXX-${v}</code></span><span class="num" style="color:var(--good)">−${eur(v)}</span></div>`:""}
     <div class="offer-line total"><span>Ihre Kosten im ersten Jahr</span><span class="num">${eur(eff)}</span></div>
     <p class="small muted" style="margin-top:6px">Entspricht etwa ${eur(eff/12)} pro Monat, ${steuer}.</p>
   </section>
   <form class="panel grid" id="custForm" data-tok="${esc(tok)}" style="gap:12px">
     <h2>Jetzt wechseln</h2>
     <div class="field"><label for="cfName">Vor- und Nachname${t.seg==="gewerbe"?" bzw. Firma":""}</label><input class="input" id="cfName" required></div>
     <div class="field"><label for="cfMail">E-Mail</label><input class="input" type="email" id="cfMail" required></div>
     <div class="field"><label for="cfAddr">Lieferadresse</label><input class="input" id="cfAddr" placeholder="Straße, Hausnummer, PLZ, Ort" required></div>
     <div class="field"><label for="cfZaehler">Zählernummer</label><input class="input mono" id="cfZaehler" required></div>
     <label class="row small" style="align-items:flex-start;gap:8px"><input type="checkbox" id="cfAgb" required style="margin-top:3px"><span>Ich beauftrage den Wechsel und die Kündigung meines bisherigen Vertrags und akzeptiere AGB und Widerrufsbelehrung des Lieferanten.</span></label>
     <button class="btn primary" type="submit">Verbindlich wechseln</button>
     <p class="small muted">Demo: Es wird noch nichts an den Lieferanten übertragen.</p>
   </form>
   <p class="notice">Der Vergleich umfasst nicht den gesamten Markt. Bei Abschluss erhalten wir eine Provision. Der Wechselbonus wird offen ausgewiesen.</p>
   <a class="small" href="#vergleich">← Zurück ins Vertriebsbüro</a>
  </div>`;
}

/* ---------- Nexxi chat ---------- */
let sampleFn = null, chatCtl = null;
(async()=>{ try{ sampleFn = await window.claude?.use?.("sample"); }catch{ sampleFn=null; } })();
function fallback(q){
  if(/Tagesplan/i.test(q)) return "08:00 Gasthof Lindenhof anrufen: Angebot KissStrom Business nachfassen, Abschluss anstreben.\n09:00 Herr Bauer: kurzer Rückruf zum Gaswechsel, Zählerstand abfragen.\n10:00 Familie Krämer: Erstkontakt per WhatsApp, Termin vorschlagen.\n11:00 Bäckerei Saaletal: Jahresabrechnung einfordern, Vergleich vorbereiten.\n13:30 Lead-Finder: 10 Hotels in Bad Kissingen ins CRM übernehmen.\n15:00 Pension Kurpark: Erstanruf, Vertragsende erfragen.\n16:30 Team-Check mit Lena Vogt und Daniel Brandt.";
  return "Nexxi ist in dieser Ansicht nicht mit Claude verbunden. Im veröffentlichten Artefakt auf claude.ai antwortet Nexxi live, nach deiner Freigabe.";
}
async function ask(q){
  const msgs=$("#msgs"); if(!msgs) return;
  S.chat.push({role:"user",content:q}); save();
  msgs.insertAdjacentHTML("beforeend",`<div class="msg me">${esc(q)}</div><div class="msg ai" id="pending">Nexxi denkt nach…</div>`);
  msgs.scrollTop=msgs.scrollHeight;
  const out=$("#pending"); const send=$("#chatSend"), stop=$("#chatStop"), note=$("#chatNote");
  send.disabled=true; stop.hidden=false; note.textContent="";
  let answer="";
  if(!sampleFn){ answer=fallback(q); out.textContent=answer; }
  else{
    chatCtl=new AbortController();
    const turns=[{role:"user",content:RULES},...S.chat.slice(-10)];
    if(turns[1]?.role==="assistant") turns.splice(1,1);
    try{ const r=await sampleFn(turns,{cache:false,signal:chatCtl.signal,onText:({text})=>{out.textContent=text;msgs.scrollTop=msgs.scrollHeight;}}); answer=r.text; if(r.truncated) note.textContent="Antwort wurde gekürzt. Frag gezielter nach."; }
    catch(e){ answer=e?.text||""; out.textContent=answer||"–";
      const map={not_granted:"Nexxi wurde nicht freigegeben. Ohne Freigabe kann ich nicht antworten.",rate_limited:"Gerade zu viele Anfragen. Bitte gleich nochmal versuchen.",session_expired:"Bitte bei Claude neu anmelden.",refused:"Diese Anfrage kann Nexxi nicht beantworten. Formuliere sie anders.",cancelled:"Gestoppt."};
      note.textContent = map[e?.code] || "Verbindung unterbrochen. Bitte nochmal senden.";
      if(e?.code==="refused"){ out.textContent="–"; answer=""; }
    }
  }
  out.removeAttribute("id");
  if(answer){ S.chat.push({role:"assistant",content:answer}); save(); }
  send.disabled=false; stop.hidden=true; msgs.scrollTop=msgs.scrollHeight;
}

/* ---------- theme / white label ---------- */
function applyWL(){
  const r=document.documentElement;
  const custom = S.wl.accent && S.wl.accent.toLowerCase()!=="#64cf17";
  if(custom){ r.style.setProperty("--brand",S.wl.accent); r.style.setProperty("--accent",`color-mix(in srgb, ${S.wl.accent} 75%, var(--fg))`); r.style.setProperty("--accent-soft",`color-mix(in srgb, ${S.wl.accent} 16%, var(--surface))`); }
  else { r.style.removeProperty("--brand"); r.style.removeProperty("--accent"); r.style.removeProperty("--accent-soft"); }
  const nm=S.wl.name||"PowerNexx";
  if(nm==="PowerNexx") $("#brandName").innerHTML='Power<span class="nx">Nexx</span>'; else $("#brandName").textContent=nm;
  $("#brandMark").innerHTML = S.wl.logo ? `<img src="${S.wl.logo}" alt="">` : `<img src="${PNX_ICON}" alt="">`;
}

/* ---------- router ---------- */
let current=(location.hash||"#dashboard").slice(1)||"dashboard";
function go(id){ current=id; try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch{} route(); }
function route(){
  let id=current;
  if(id.startsWith("angebot-")){ document.body.classList.add("customer"); $("#view").innerHTML=customerView(id); window.scrollTo(0,0); return; }
  document.body.classList.remove("customer");
  if(!V[id]) id="dashboard";
  renderNav(id); $("#view").innerHTML=V[id](); window.scrollTo(0,0);
  if(id==="nexxi"){ const m=$("#msgs"); m.scrollTop=m.scrollHeight; if(pendingAsk){ const q=pendingAsk; pendingAsk=null; ask(q);} }
}
let pendingAsk=null;
window.addEventListener("hashchange",()=>{ current=location.hash.slice(1)||"dashboard"; route(); });

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("button,a,[data-close]"); if(!t) return;
  if(t.matches("[data-close]") && e.target===t) return closeModal();
  if(t.matches("[data-close-btn]")) return closeModal();
  const d=t.dataset;
  if(d.plan){ e.preventDefault(); pendingAsk=planPrompt(); return go("nexxi"); }
  if(t.tagName==="A" && (t.getAttribute("href")||"").startsWith("#")){ e.preventDefault(); return go(t.getAttribute("href").slice(1)||"dashboard"); }
  if(d.openOffer){ closeModal(); return go(d.openOffer); }
  if(d.seg){ cmp.seg=d.seg; cmp.kwh = d.seg==="privat"?(cmp.typ==="strom"?3500:15000):(cmp.typ==="strom"?42000:60000); return route(); }
  if(d.typ){ cmp.typ=d.typ; cmp.kwh = cmp.seg==="privat"?(d.typ==="strom"?3500:15000):(d.typ==="strom"?42000:60000); return route(); }
  if(d.offer){ const t2=tariffProvider.search(cmp).find(x=>x.id===d.offer); return offerModal(t2); }
  if(d.copy){ return copy($(d.copy).value); }
  if(d.copyText!==undefined){ return copy(d.copyText); }
  if(d.openLead){ e.preventDefault(); return leadModal(S.leads.find(l=>l.id===d.openLead)); }
  if(t.hasAttribute("data-new-lead")) return leadModal(null);
  if(d.delLead){ S.leads=S.leads.filter(l=>l.id!==d.delLead); save(); closeModal(); toast("Lead gelöscht"); return route(); }
  if(d.wa){ const l=S.leads.find(x=>x.id===d.wa); whatsappProvider.send(l,"Begrüßung"); l.verlauf.push({d:addDays(0),t:"WhatsApp-Nachricht gesendet (Demo)"}); save(); closeModal(); toast("WhatsApp in Demo protokolliert"); return route(); }
  if(d.compareLead){ const l=S.leads.find(x=>x.id===d.compareLead); cmp={seg:l.seg,typ:l.typ,plz:"97688",kwh:l.kwh}; closeModal(); return go("vergleich"); }
  if(d.take){ const r=finderResults.find(x=>x.id===d.take); S.leads.push({id:uid(),name:r.name,kontakt:"",tel:r.tel,seg:"gewerbe",typ:"strom",kwh:r.kwh,quelle:"Google-Maps-Suche",stage:"neu",wv:addDays(1),ablauf:"",verlauf:[{d:addDays(0),t:`Über Lead-Finder gefunden (${r.branche}, ${r.ort})`}]}); save(); toast("Ins CRM übernommen"); return route(); }
  if(d.quick!==undefined){ const [,q]=QUICK[+d.quick]; return ask(q||planPrompt()); }
  if(t.hasAttribute("data-clear-chat")){ S.chat=[]; save(); return route(); }
  if(t.id==="chatStop"){ chatCtl?.abort(); return; }
  if(t.hasAttribute("data-wl-reset")){ S.wl={name:"PowerNexx",accent:"",domain:"",logo:""}; save(); applyWL(); toast("Zurückgesetzt"); return route(); }
  if(d.buy){ toast(`${d.buy}: Bezahlung wird mit Stripe angebunden`); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
document.addEventListener("change",e=>{
  if(e.target.dataset.auto){ const a=S.automations.find(x=>x.id===e.target.dataset.auto); a.on=e.target.checked; save(); toast(a.on?"Ablauf aktiviert":"Ablauf pausiert"); }
});
document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="custForm"){ const o=parseOffer(f.dataset.tok); if(!o) return; const name=$("#cfName").value.trim();
    S.leads.push({id:uid(),name:name||"Online-Kunde",kontakt:name,tel:"",seg:o.t.seg,typ:o.t.typ,kwh:o.kwh,quelle:"Angebotslink",stage:"abschluss",wv:"",ablauf:"",verlauf:[{d:addDays(0),t:`Online-Abschluss über Angebotslink: ${o.t.anbieter} ${o.t.name}${o.v?`, Gutschein NEXX-${o.v}`:""}`}]}); save();
    f.outerHTML=`<section class="panel"><h2>Vielen Dank${name?", "+esc(name.split(" ")[0]):""}!</h2><p class="muted" style="margin-top:6px">Ihr Wechselauftrag ist eingegangen. Sie erhalten in Kürze eine Bestätigung per E-Mail.</p></section>`; return; }
  if(f.id==="cmpForm"){ cmp.plz=$("#plz").value.replace(/\D/g,"").slice(0,5)||"97688"; cmp.kwh=Math.max(100,parseInt($("#kwh").value.replace(/\D/g,""))||3500); S.settings.minMarge=Math.max(0,parseInt($("#marge").value)||0); save(); return route(); }
  if(f.id==="finderForm"){ finderQ={branche:$("#branche").value,ort:$("#ort").value.trim()||"Bad Kissingen"}; finderResults=leadFinderProvider.search(finderQ.branche,finderQ.ort); return route(); }
  if(f.id==="chatForm"){ const v=$("#chatIn").value.trim(); if(!v) return; $("#chatIn").value=""; return ask(v); }
  if(f.id==="autoForm"){ const steps=[$("#aAct1").value,$("#aAct2").value].filter(Boolean); S.automations.unshift({id:uid(),on:true,name:$("#aName").value.trim(),trigger:$("#aTrig").value,steps,runs:0}); save(); toast("Ablauf gespeichert"); return route(); }
  if(f.id==="leadForm"){
    const id=f.dataset.id; let l=S.leads.find(x=>x.id===id); const isNew=!l;
    if(isNew){ l={id,verlauf:[{d:addDays(0),t:"Lead angelegt"}]}; S.leads.push(l); }
    const prevStage=l.stage;
    Object.assign(l,{name:$("#lfName").value.trim(),kontakt:$("#lfKontakt").value.trim(),tel:$("#lfTel").value.trim(),kwh:parseInt($("#lfKwh").value.replace(/\D/g,""))||0,seg:$("#lfSeg").value,typ:$("#lfTyp").value,stage:$("#lfStage").value,quelle:$("#lfQuelle").value,wv:$("#lfWv").value,ablauf:$("#lfAblauf").value});
    if(!isNew && prevStage!==l.stage) l.verlauf.push({d:addDays(0),t:`Status → ${STAGES.find(s=>s[0]===l.stage)[1]}`});
    const n=$("#lfNote").value.trim(); if(n) l.verlauf.push({d:addDays(0),t:n});
    save(); closeModal(); toast(isNew?"Lead angelegt":"Gespeichert"); return route();
  }
  if(f.id==="wlForm"){
    const file=$("#wlLogo").files[0];
    const finish=()=>{ S.wl.name=$("#wlName").value.trim()||"PowerNexx"; S.wl.accent=$("#wlAccent").value; S.wl.domain=$("#wlDomain").value.trim(); save(); applyWL(); toast("White Label übernommen"); route(); };
    if(file){ if(file.size>400000){ toast("Logo bitte unter 400 KB"); return; } const rd=new FileReader(); rd.onload=()=>{ S.wl.logo=rd.result; finish(); }; rd.readAsDataURL(file); } else finish();
  }
});
/* drag & drop kanban */
document.addEventListener("dragstart",e=>{ const c=e.target.closest?.("[data-card]"); if(c){ e.dataTransfer.setData("text/plain",c.dataset.card); }});
document.addEventListener("dragover",e=>{ const col=e.target.closest?.("[data-col]"); if(col){ e.preventDefault(); col.classList.add("drop"); }});
document.addEventListener("dragleave",e=>{ const col=e.target.closest?.("[data-col]"); if(col) col.classList.remove("drop"); });
document.addEventListener("drop",e=>{ const col=e.target.closest?.("[data-col]"); if(!col) return; e.preventDefault(); const id=e.dataTransfer.getData("text/plain"); const l=S.leads.find(x=>x.id===id); if(l && l.stage!==col.dataset.col){ l.stage=col.dataset.col; l.verlauf.push({d:addDays(0),t:`Status → ${STAGES.find(s=>s[0]===l.stage)[1]}`}); save(); toast("Status aktualisiert"); } route(); });

applyWL(); route();
})();
</script>

</body>
